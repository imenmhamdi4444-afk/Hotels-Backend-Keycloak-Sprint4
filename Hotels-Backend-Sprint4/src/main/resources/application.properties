spring.datasource.url=jdbc:mysql://localhost:3306/spring_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

server.port=8081
server.servlet.context-path=
spring.main.allow-circular-references=true

# Disable DevTools auto-restart (fixes HttpSecurity ClassLoader conflict)
spring.devtools.restart.enabled=false

# Image upload configuration
file.upload-dir=C:/hotel-images
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Keycloak Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8090/realms/imen-realm


