<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<title>Connexion - Hotels</title>
<link rel="stylesheet"
th:href="@{/webjars/bootstrap/4.3.1/css/bootstrap.min.css}"/>
</head>
<body class="bg-light">
<div class="container mt-5">
<div class="row justify-content-center">
<div class="col-md-4">
<div class="card shadow-sm">
<div class="card-header bg-dark text-white text-center py-3">
<h4>Connexion Hotels</h4>
</div>
<div class="card-body p-4">
<!-- Spring ajoute ?error dans l'URL après un échec de login -->
<div th:if="${param.error}" class="alert alert-danger">
Nom d'utilisateur ou mot de passe incorrect.
</div>
<!-- Spring ajoute ?logout dans l'URL après déconnexion -->
<div th:if="${param.logout}" class="alert alert-success">
Vous avez été déconnecté avec succès.
</div>
<!-- Spring Security intercepte automatiquement POST /login -->
<form th:action="@{/login}" method="post">
<div class="form-group">
<label>Utilisateur :</label>
<!-- IMPORTANT : name="username" est obligatoire -->
<input type="text" name="username"
class="form-control" required autofocus/>
</div>
<div class="form-group">
<label>Mot de passe :</label>
<!-- IMPORTANT : name="password" est obligatoire -->
<input type="password" name="password"
class="form-control" required/>
</div>
<button type="submit"
class="btn btn-dark btn-block mt-3">
Se connecter
</button>
</form>
</div>
</div>
</div>
</div>
</div>
</body>
</html>
